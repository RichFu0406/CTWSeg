DATA:
  data_name: ctw3d_parts
  data_root: data/ctw3d_parts
  test_area: 5
  classes: 7
  fea_dim: 6
  voxel_size: 0.04
  voxel_max: 80000
  loop: 30

MODEL:
  encoder_channels: [32, 64, 128, 256, 512]  # output channels of five stages
  encoder_blocks: [1, 3, 3, 6, 3]  # block count of five encoder stages
  decoder_blocks: [1, 1, 1, 1, 1]  # block count of five decoder stages
  encoder_strides: [1, 4, 4, 4, 4]  # downsampling stride of five stages
  knn_k: 16  # KNN neighbors for stages 2-5; stage 1 remains 8
  dropout_rate: 0.5
  interpolation_k: 3  # KNN neighbors used by feature interpolation
  # Module ablation: M0=False/False, M1=True/False,
  # M2=False/True, M3=True/True (position encoding/center attention).
  use_position_encoding: True
  use_center_attention: True

RESULT:
  result_root: results  # results/<labeled_point>/ckpt and vis

TRAIN:
  ignore_label: 255
  train_gpu: 0
  workers: 16  # data loader workers
  batch_size: 4  # batch size for training
  batch_size_val: 2  # batch size for validation during training, memory and speed tradeoff
  base_lr: 0.0005 #0.0005
  epochs: 100
  start_epoch: 0
  weight_decay: 0.1 #0.1 #0.0001
  manual_seed: 7777
  print_freq: 1
  save_freq: 1
  weight:  # path to initial weight (default: none)
  resume: # resume from previous steps (suggest: model_last.pth)
  evaluate: True  # evaluate on validation set, extra gpu memory needed and small batch_size_val is recommend
  eval_freq: 1
  labeled_point: 1%
  ema_decay: 0.99  # EMA teacher update rate
  pseudo_threshold: 0.9  # minimum teacher confidence
  pseudo_temperature: 1.0  # teacher softmax temperature
  # Loss ablation presets (dice/pseudo/entropy):
  # L0=0/0/0, L1=0.5/0/0, L2=0.5/1.0/0, L3=0.5/1.0/0.01.
  pseudo_weight: 1.0  # pseudo-label CE weight
  pseudo_rampup_epochs: 20  # epochs used to enable pseudo supervision gradually
  dice_weight: 0.5  # supervised Dice loss weight
  entropy_weight: 0.01  # unlabeled entropy loss weight

TEST:
  test_gpu: 0
  batch_size_test: 4
  model_path:  # empty: results/<labeled_point>/ckpt/model_best.pth
  names_path: preprocess/meta/class_names.txt
